name: Crawl Taean Reviews Artifact
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/crawl-taean-artifact.yml"]
permissions:
  contents: read
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Crawl all Taean visitor reviews
        run: |
          python - <<'PY'
          import requests, json, re, concurrent.futures, os, time, csv
          from datetime import datetime, timezone
          requests.packages.urllib3.disable_warnings()
          ID='1199941102';TYPE='restaurant';PAGE=f'https://m.place.naver.com/{TYPE}/{ID}/review/visitor?reviewSort=recent';TARGET='https://pcmap-api.place.naver.com/place/graphql'
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1'
          HEAD={'User-Agent':UA,'Accept':'application/json, text/plain, */*','Accept-Language':'ko-KR,ko;q=0.9','Content-Type':'application/json','Origin':'https://pcmap.place.naver.com','Referer':PAGE}
          def state(html):
              idx=html.find('window.__APOLLO_STATE__');eq=html.find('=',idx);s=html.find('{',eq);d=0;q=False;esc=False;end=-1
              for i in range(s,len(html)):
                  c=html[i]
                  if q:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=='"':q=False
                      continue
                  if c=='"':q=True;continue
                  if c=='{':d+=1
                  elif c=='}':
                      d-=1
                      if d==0:end=i+1;break
              return json.loads(html[s:end])
          rr=requests.get(PAGE,headers={'User-Agent':UA},timeout=25);st=state(rr.text);root=st['ROOT_QUERY'];feeds=[]
          for k,v in root.items():
              if not k.startswith('visitorReviews(') or not isinstance(v,dict) or not isinstance(v.get('items'),list):continue
              try:inp=json.loads(k[len('visitorReviews('):-1])['input']
              except:continue
              refs=[x.get('__ref') for x in v['items'] if isinstance(x,dict) and x.get('__ref')];items=[st[r] for r in refs if r in st];total=int(v.get('total') or 0)
              if total>0:feeds.append({'input':inp,'items':items,'total':total})
          uniq=[];sig=set()
          for f in sorted(feeds,key=lambda x:x['total'],reverse=True):
              key=(f['total'],f['input'].get('includeContent'),f['input'].get('sort'),f['input'].get('item'))
              if key not in sig:sig.add(key);uniq.append(f)
          feeds=uniq[:3];print('FEEDS',[(f['total'],f['input'].get('includeContent')) for f in feeds],flush=True)
          sources=['https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/protocols/http/data.txt','https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt','https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt'];pool=[]
          for src in sources:
              try:
                  for p in requests.get(src,timeout=15).text.splitlines():
                      p=p.strip().replace('http://','').replace('https://','')
                      if re.match(r'^\d{1,3}(?:\.\d{1,3}){3}:\d+$',p) and p not in pool:pool.append(p)
              except:pass
          pool=pool[:800];working=['34.134.231.117:3129']
          query='query getVisitorReviews($input: VisitorReviewsInput) { visitorReviews(input: $input) { items { id cursor reviewId rating author { id nickname } body visitCount visited created reply { body created } originType votedKeywords { code name } } total } }'
          def post(px,payload,timeout=12):
              try:
                  pr={'http':'http://'+px,'https':'http://'+px};r=requests.post(TARGET,headers=HEAD,json=payload,proxies=pr,timeout=timeout,verify=False)
                  if r.status_code!=200:return None
                  return (r.json().get('data') or {}).get('visitorReviews')
              except:return None
          def discover(payload):
              candidates=[p for p in pool if p not in working];found=[]
              with concurrent.futures.ThreadPoolExecutor(max_workers=60) as ex:
                  futs={ex.submit(post,p,payload,5):p for p in candidates[:750]}
                  for fut in concurrent.futures.as_completed(futs):
                      vr=fut.result()
                      if isinstance(vr,dict) and vr.get('items'):
                          found.append(futs[fut]);print('NEW PROXY',futs[fut],flush=True)
                          if len(found)>=12:break
                  for f in futs:f.cancel()
              working.extend([p for p in found if p not in working])
          def more(base,after):
              inp=dict(base);inp['after']=after;inp['size']=50;payload={'operationName':'getVisitorReviews','variables':{'input':inp,'id':ID},'query':query}
              for px in list(working):
                  vr=post(px,payload)
                  if isinstance(vr,dict) and isinstance(vr.get('items'),list):return vr,px
                  if px in working:working.remove(px)
              discover(payload)
              for px in list(working):
                  vr=post(px,payload)
                  if isinstance(vr,dict) and isinstance(vr.get('items'),list):return vr,px
              raise RuntimeError('no proxy')
          crawled=[]
          for fi,f in enumerate(feeds):
              rows=[];seen=set()
              def add(x):
                  rid=x.get('id') or x.get('reviewId')
                  if rid and rid not in seen:seen.add(rid);rows.append(x)
              for x in f['items']:add(x)
              while len(rows)<f['total']:
                  vr,px=more(f['input'],rows[-1]['cursor']);before=len(rows)
                  for x in vr.get('items') or []:add(x)
                  print('FEED',fi,len(rows),'/',f['total'],'via',px,flush=True)
                  if len(rows)==before:raise RuntimeError('stalled')
                  time.sleep(.15)
              crawled.append({'total':f['total'],'includeContent':f['input'].get('includeContent'),'items':rows})
          merged=[];seen=set()
          for f in crawled:
              form='텍스트·콘텐츠형' if f['includeContent'] else '키워드·별점형'
              for x in f['items']:
                  rid=x.get('id') or x.get('reviewId')
                  if not rid or rid in seen:continue
                  seen.add(rid);y=dict(x);y['reviewForm']=form;merged.append(y)
          def date(txt):
              if not txt:return ''
              m=re.match(r'\s*(\d{1,2})\.(\d{1,2})\.',str(txt));return f'2026-{int(m.group(1)):02d}-{int(m.group(2)):02d}' if m else str(txt)
          rows=[]
          for i,x in enumerate(merged,1):
              a=x.get('author') or {};rep=x.get('reply') or {};voted=[v.get('name') or v.get('code') for v in (x.get('votedKeywords') or []) if isinstance(v,dict) and (v.get('name') or v.get('code'))]
              rows.append({'no':i,'reviewId':x.get('id') or x.get('reviewId') or '','reviewForm':x.get('reviewForm'),'rating':x.get('rating'),'body':x.get('body') or '','reviewDate':date(x.get('created')),'visitDate':date(x.get('visited')),'visitCount':x.get('visitCount'),'reviewer':a.get('nickname') or '','originType':x.get('originType') or '','votedKeywords':voted,'reply':rep.get('body') or ''})
          base=st.get('PlaceDetailBase:'+ID) or {};vs=st.get('VisitorReviewStatsResult:'+ID) or {};rev=vs.get('review') or {};ana=vs.get('analysis') or {}
          meta={'placeId':ID,'placeName':base.get('name'),'sourceUrl':'https://naver.me/FnV8nOmy','scrapedAt':datetime.now(timezone.utc).isoformat(),'feedTotals':[f['total'] for f in crawled],'uniqueTotal':len(rows),'textBodyCount':sum(bool(r['body'].strip()) for r in rows),'avgRating':rev.get('avgRating'),'starDistribution':rev.get('starDistribution'),'visitorReviewsTotal':base.get('visitorReviewsTotal'),'visitorReviewsTextReviewTotal':base.get('visitorReviewsTextReviewTotal'),'votedKeyword':ana.get('votedKeyword'),'themes':ana.get('themes'),'menus':ana.get('menus'),'address':base.get('roadAddress') or base.get('address'),'phone':base.get('phone'),'oldestReviewDate':min((r['reviewDate'] for r in rows if re.match(r'^\d{4}-',r['reviewDate'])),default=''),'newestReviewDate':max((r['reviewDate'] for r in rows if re.match(r'^\d{4}-',r['reviewDate'])),default='')}
          print('META',json.dumps({k:meta[k] for k in ['placeName','feedTotals','uniqueTotal','textBodyCount','avgRating','visitorReviewsTotal','visitorReviewsTextReviewTotal','oldestReviewDate','newestReviewDate']},ensure_ascii=False),flush=True)
          os.makedirs('taean_dataset',exist_ok=True);json.dump(rows,open('taean_dataset/reviews_full.json','w',encoding='utf-8'),ensure_ascii=False,indent=2);json.dump(meta,open('taean_dataset/meta_full.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          with open('taean_dataset/reviews_full.csv','w',encoding='utf-8-sig',newline='') as f:
              cols=list(rows[0]);w=csv.DictWriter(f,fieldnames=cols);w.writeheader()
              for r in rows:z=dict(r);z['votedKeywords']=' | '.join(z['votedKeywords']);w.writerow(z)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: taean-full-dataset
          path: taean_dataset/
          retention-days: 1