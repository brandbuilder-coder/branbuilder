name: Resolve Dohwa Galbi Naver Link
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/resolve-dohwa.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve
        run: |
          node - <<'NODE'
          (async()=>{const r=await fetch('https://naver.me/FhudElJ0',{redirect:'follow',headers:{'user-agent':'Mozilla/5.0'}});console.log('STATUS',r.status);console.log('FINAL',r.url);const t=await r.text();console.log('BODY',t.slice(0,1000));})().catch(e=>{console.error(e);process.exit(1)})
          NODE
