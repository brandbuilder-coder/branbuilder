name: Resolve Taean Place
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/resolve-taean-place.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Naver short links
        run: |
          python - <<'PY'
          import requests,re
          for u in ['https://naver.me/FnV8nOmy','https://naver.me/GiptmgRz']:
              r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},allow_redirects=True,timeout=20)
              print('SHORT',u,'STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.text))
              for pat in [r'm\.place\.naver\.com/(?:restaurant|place)/(\d+)',r'placeId["\'=:\s]+(\d+)',r'"id":"(\d{7,})"',r'entry=pll&placePath=.+?(\d{7,})']:
                  m=re.search(pat,r.text)
                  if m: print('MATCH',pat,m.group(1))
              print(r.text[:2500].replace('\n',' '))
          PY