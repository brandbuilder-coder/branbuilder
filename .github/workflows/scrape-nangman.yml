name: Scrape Nangman Naver Reviews

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/scrape-nangman.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Naver visitor reviews
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const placeId = '1731676306';
          const placeName = '낭만식탁';
          const sourceUrl = 'https://naver.me/xDJdkulM';
          const DISPLAY = 20;
          const query = 'query getVisitorReviews($input: VisitorReviewsInput) { visitorReviews(input: $input) { total items { id rating author { nickname } body visitCount viewCount visited created reply { body created } votedKeywords { code displayName } originType } } }';
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function request(page) {
            const payload = {
              operationName: 'getVisitorReviews',
              query,
              variables: {
                id: placeId,
                input: {
                  bookingBusinessId: 'null',
                  businessId: placeId,
                  businessType: 'restaurant',
                  cidList: ['220036','220038','220089','1000404'],
                  display: DISPLAY,
                  getAuthorInfo: true,
                  includeContent: true,
                  includeReceiptPhotos: false,
                  isPhotoUsed: false,
                  item: '0',
                  sort: 'recent',
                  page
                }
              }
            };
            const res = await fetch('https://pcmap-api.place.naver.com/place/graphql', {
              method:'POST',
              headers:{
                'content-type':'application/json',
                'accept':'application/json, text/plain, */*',
                'accept-language':'ko-KR,ko;q=0.9',
                'referer':`https://pcmap.place.naver.com/restaurant/${placeId}/review/visitor`,
                'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'
              },
              body: JSON.stringify(payload)
            });
            const text = await res.text();
            if(!res.ok) throw new Error(`HTTP ${res.status}: ${text.slice(0,180)}`);
            const json = JSON.parse(text);
            if(json?.errors?.length) throw new Error(JSON.stringify(json.errors).slice(0,300));
            if(!json?.data?.visitorReviews) throw new Error(`visitorReviews missing: ${text.slice(0,300)}`);
            return json.data.visitorReviews;
          }

          (async()=>{
            const first = await request(1);
            const total = Number(first.total||0);
            const pages = Math.max(1, Math.ceil(total / DISPLAY));
            let all = [...(first.items||[])];
            console.log(`page 1 count=${first.items?.length||0}, first=${first.items?.[0]?.id}, last=${first.items?.at(-1)?.id}, total=${total}`);
            for(let p=2;p<=pages;p++){
              await sleep(1200);
              const part = await request(p);
              console.log(`page ${p} count=${part.items?.length||0}, first=${part.items?.[0]?.id}, last=${part.items?.at(-1)?.id}`);
              all.push(...(part.items||[]));
            }
            const before = all.length;
            const seen = new Set();
            all = all.filter(r=>{const key=r?.id||`${r?.created||''}|${r?.body||''}`;if(seen.has(key))return false;seen.add(key);return true;});
            const compact = all.map((r,i)=>({
              no:i+1,
              id:r.id||'',
              date:r.created||r.visited||'',
              visited:r.visited||'',
              rating:r.rating??'',
              body:r.body||'',
              visitCount:r.visitCount??'',
              keywords:(r.votedKeywords||[]).map(k=>k.displayName||k.code).filter(Boolean),
              reply:r.reply?.body||'',
              originType:r.originType||''
            }));
            const out={placeId,placeName,sourceUrl,businessType:'restaurant',naverTotal:total,fetchedRawCount:before,fetchedCount:all.length,textReviewCount:compact.filter(x=>x.body.trim()).length,fetchedAt:new Date().toISOString(),reviews:all};
            fs.mkdirSync('naver-place-nangman',{recursive:true});
            fs.writeFileSync('naver-place-nangman/reviews.json',JSON.stringify(out,null,2),'utf8');
            fs.writeFileSync('naver-place-nangman/reviews_compact.ndjson',compact.map(x=>JSON.stringify(x)).join('\n')+'\n','utf8');
            console.log(`unique ${all.length}/${total}; text ${out.textReviewCount}; raw ${before}`);
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Commit crawl result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naver-place-nangman/reviews.json naver-place-nangman/reviews_compact.ndjson
          git diff --cached --quiet && exit 0
          git commit -m "Update 낭만식탁 paginated Naver reviews [skip scrape]"
          git push
